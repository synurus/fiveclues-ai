# AI 자동플레이 — 하루 5번(24시간에 고르게) AI가 직접 2판씩 플레이해서 피드백을
# 만들어낸다(apps/backend/src/bot/autoPlay.ts). 08시엔 self-improve.yml의
# propose.mjs가 이 피드백들(+ 실제 플레이어 피드백)을 모아 PR을 낸다.
# 두 워크플로를 따로 둔 이유: 이건 시간마다 여러 번 돌고 propose는 하루 한 번만
# 도는, 서로 다른 리듬이라 한 파일에 조건 분기로 합치는 것보다 각자 스케줄을
# 갖는 게 더 단순하다.
name: Self-Improve Auto-Play

on:
  workflow_dispatch:
    inputs:
      games:
        description: '이번 실행에서 플레이할 판 수'
        required: false
        default: '2'
      guesser:
        description: '추측자 강제 지정 — auto(매 실행 첫 판만 자동) / groq(전 판 Groq) / gemini(전 판 제미나이, "첫 판만" 제한 무시)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - groq
          - gemini
  schedule:
    # 하루 5번, 24시간에 4시간 48분 간격으로 고르게 흩어놨다(2026-09-26) — 시간대는
    # 상관없다. 실행마다 2판(제미나이 추측 1판 + Groq 추측 1판)이라 하루 10판이
    # 쌓이고, 이게 다음 날 propose.mjs가 한 번에 읽는 피드백 수(MAX_FEEDBACK_FOR_PROMPT
    # = 10)와 맞는다.
    #
    # 간격을 이렇게 벌린 이유: 원래는 '7 16-22 * * *'(01~07시 KST 매시 7슬롯)이었는데,
    # 2026-09-18~26 실행 기록(created_at) 26건을 뽑아보니 그날 첫 실행이 목표보다
    # 2.5~4시간씩 늦게 돌고(예: 01:07 목표가 04:37에 실행), 그 사이 지나간 매시
    # 트리거는 재실행·대기 없이 그냥 버려져 하루 2번만 돌았다. GitHub 공식 문서는
    # "부하가 높으면 예약 실행이 지연·누락될 수 있다"고만 적어뒀고 원인은 GitHub 내부
    # 사정이라 우리가 고칠 수 없다 — 그래서 트리거 간격을 관측된 최대 지연(약 4시간)
    # 보다 넓게 잡아, 한 실행이 밀려도 다음 트리거가 버려지지 않게 했다. 지연이
    # 4시간 48분을 넘기 시작하면 다시 버려질 수 있으니 실행 기록을 한 번씩 볼 것.
    #
    # 분(minute)을 정각·7분 같은 둥근 값이 아니라 제각각으로 둔 이유: 매시 정각은
    # 전 세계 예약 워크플로가 몰려 GitHub이 부하가 높으면 그 실행을 건너뛰는(재시도
    # 없음) 시간대라고 공식 문서가 명시한다.
    #
    # UTC → KST(+9): 00:17→09:17, 05:05→14:05, 09:53→18:53, 14:41→23:41, 19:29→04:29.
    # self-improve.yml(propose, 23:07 UTC = 08:07 KST 목표)과는 한 시간 이상 떨어져 있다.
    - cron: '17 0 * * *'
    - cron: '5 5 * * *'
    - cron: '53 9 * * *'
    - cron: '41 14 * * *'
    - cron: '29 19 * * *'

permissions:
  contents: read
  issues: write

jobs:
  play:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 이 레포는 npm 워크스페이스라 package-lock.json 이 루트에만 있다(self-improve.yml
      # 과 같은 이유).
      - name: 의존성 설치 (워크스페이스 전체)
        run: npm ci

      - name: AI 자동 플레이 + 피드백 생성
        env:
          BOT_BASE_URL: ${{ secrets.BOT_BASE_URL }}
          BOT_API_KEY: ${{ secrets.BOT_API_KEY }}
          BOT_MODEL: ${{ secrets.BOT_MODEL }}
          # createFeedbackIssue()는 이 두 이름을 읽는다(apps/backend/src/github/feedbackIssue.ts).
          # 로컬 서버가 쓰는 별도 fine-grained PAT 대신, 이 워크플로 자체의 권한이
          # 담긴 GITHUB_TOKEN을 그대로 써도 된다 — 같은 레포 안이라 issues: write 로 충분하다.
          GITHUB_FEEDBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          # 스케줄(cron) 실행엔 github.event.inputs 자체가 없어서 이 기본값(2)이
          # 쓰인다 — 첫 판은 제미나이 추측, 둘째 판은 Groq 추측(autoPlay.ts의
          # guesserOverrideFor). 하루 5번 × 2판 = 10판(위 cron 주석).
          AUTO_PLAY_GAMES: ${{ github.event.inputs.games || '2' }}
          # 제미나이 추측자 비교 실험(2026-09-17, apps/backend/src/bot/autoPlay.ts).
          # 전용 시크릿을 안 만들고 self-improve.yml이 쓰는 SELFIMPROVE_BOT_*를 그대로
          # 재사용한다 — 없으면(둘 다 미설정) autoPlay.ts가 알아서 실험을 끈다.
          SELFIMPROVE_BOT_BASE_URL: ${{ secrets.SELFIMPROVE_BOT_BASE_URL }}
          SELFIMPROVE_BOT_API_KEY: ${{ secrets.SELFIMPROVE_BOT_API_KEY }}
          SELFIMPROVE_BOT_MODEL: ${{ secrets.SELFIMPROVE_BOT_MODEL }}
          # 수동 실행에서 추측자를 직접 고를 때만 값이 실린다(2026-09-18) — 스케줄
          # (cron) 실행엔 이 input 자체가 없어서 항상 'auto'로 떨어진다.
          AUTOPLAY_GUESSER_MODE: ${{ github.event.inputs.guesser || 'auto' }}
        run: npm run autoplay -w backend
