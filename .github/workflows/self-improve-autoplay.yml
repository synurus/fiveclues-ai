# AI 자동플레이 — 01~07시 KST 사이 매시 AI가 직접 몇 판씩 플레이해서 피드백을
# 만들어낸다(apps/backend/src/bot/autoPlay.ts). 08시엔 self-improve.yml의
# propose.mjs가 이 피드백들(+ 실제 플레이어 피드백)을 모아 PR을 낸다.
# 두 워크플로를 따로 둔 이유: 이건 시간마다 여러 번 돌고 propose는 하루 한 번만
# 도는, 서로 다른 리듬이라 한 파일에 조건 분기로 합치는 것보다 각자 스케줄을
# 갖는 게 더 단순하다.
name: Self-Improve Auto-Play

on:
  workflow_dispatch:
    inputs:
      games:
        description: '이번 실행에서 플레이할 판 수'
        required: false
        default: '2'
      guesser:
        description: '추측자 강제 지정 — auto(매 실행 첫 판만 자동) / groq(전 판 Groq) / gemini(전 판 제미나이, "첫 판만" 제한 무시)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - groq
          - gemini
  schedule:
    # 01~07시 KST(UTC+9) 매시 = 전날 UTC 16~22시가 목표다(정각이 아니라 7분인 이유는
    # 아래). 실제로는 이렇게 안 돈다 — 2026-09-18~26 실행 기록(created_at) 26건을
    # 다 뽑아봤더니 그날 첫 실행이 목표보다 2.5~4시간씩 늦게 도는데(예: 01:07 목표가
    # 04:37에 실행), 그 사이에 지나간 매시 트리거(02시·03시 등)는 재실행이나 대기
    # 없이 그냥 버려진다 — 그래서 하루 7번이 아니라 2번(그날의 "이른 실행"과 "늦은
    # 실행")만 돈다(2026-09-26 확인). GitHub 공식 문서는 "부하가 높으면 예약 실행이
    # 지연·누락될 수 있다"고만 적어뒀고, 이 레포가 왜 이렇게까지 밀리는지는 GitHub
    # 내부 사정이라 우리 쪽에서 고칠 방법이 없다 — 그래서 "언제 도느냐"에 의존하던
    # 로직(제미나이 추측자 시간대 필터)을 없애고 "판 수"로 보정했다(AUTO_PLAY_GAMES
    # 기본값 참고, autoPlay.ts의 GUESSER_OVERRIDE 주석도).
    #
    # 정각(0분)이 아니라 7분인 이유는 남아 있다 — 매시 정각은 전 세계 예약 워크플로가
    # 몰려서 GitHub이 부하가 높으면 그 실행을 그냥 건너뛰는(재시도 없음) 시간대라고
    # 공식 문서가 명시한다(2026-09-17 정각에서 옮김). 위에서 보듯 그것만으로는
    # 부족했지만, 굳이 다시 정각으로 되돌릴 이유도 없다.
    - cron: '7 16-22 * * *'

permissions:
  contents: read
  issues: write

jobs:
  play:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 이 레포는 npm 워크스페이스라 package-lock.json 이 루트에만 있다(self-improve.yml
      # 과 같은 이유).
      - name: 의존성 설치 (워크스페이스 전체)
        run: npm ci

      - name: AI 자동 플레이 + 피드백 생성
        env:
          BOT_BASE_URL: ${{ secrets.BOT_BASE_URL }}
          BOT_API_KEY: ${{ secrets.BOT_API_KEY }}
          BOT_MODEL: ${{ secrets.BOT_MODEL }}
          # createFeedbackIssue()는 이 두 이름을 읽는다(apps/backend/src/github/feedbackIssue.ts).
          # 로컬 서버가 쓰는 별도 fine-grained PAT 대신, 이 워크플로 자체의 권한이
          # 담긴 GITHUB_TOKEN을 그대로 써도 된다 — 같은 레포 안이라 issues: write 로 충분하다.
          GITHUB_FEEDBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          # 스케줄(cron) 실행엔 github.event.inputs 자체가 없어서 이 기본값(6)이
          # 쓰인다 — 원래 "7슬롯 × 2판 = 하루 14판" 의도였는데 실제로는 하루 2번만
          # 도니(위 cron 주석) 6판으로 늘려 총량을 비슷하게 맞췄다(2026-09-26).
          # 수동 실행(workflow_dispatch)은 입력 필드 자체의 기본값 '2'를 따로 쓴다.
          AUTO_PLAY_GAMES: ${{ github.event.inputs.games || '6' }}
          # 제미나이 추측자 비교 실험(2026-09-17, apps/backend/src/bot/autoPlay.ts).
          # 전용 시크릿을 안 만들고 self-improve.yml이 쓰는 SELFIMPROVE_BOT_*를 그대로
          # 재사용한다 — 없으면(둘 다 미설정) autoPlay.ts가 알아서 실험을 끈다.
          SELFIMPROVE_BOT_BASE_URL: ${{ secrets.SELFIMPROVE_BOT_BASE_URL }}
          SELFIMPROVE_BOT_API_KEY: ${{ secrets.SELFIMPROVE_BOT_API_KEY }}
          SELFIMPROVE_BOT_MODEL: ${{ secrets.SELFIMPROVE_BOT_MODEL }}
          # 수동 실행에서 추측자를 직접 고를 때만 값이 실린다(2026-09-18) — 스케줄
          # (cron) 실행엔 이 input 자체가 없어서 항상 'auto'로 떨어진다.
          AUTOPLAY_GUESSER_MODE: ${{ github.event.inputs.guesser || 'auto' }}
        run: npm run autoplay -w backend
