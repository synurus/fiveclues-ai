# "AI 출제자 개선 기록" 페이지(apps/frontend/guides/prompt-history.html)를 다시 만들어
# 커밋한다(scripts/prompt-history.mjs, 2026-09-29). 세대별 정답률은 피드백이 쌓일수록
# 바뀌니 하루 한 번, 그리고 지시문(hintPrompt.ts)이나 쉬운 설명(prompt-history-notes.json)이
# 바뀔 때. 바뀐 게 없으면 커밋하지 않는다.
#
# UTC 03:37 = KST 12:37 — 자가개선 PR(KST 08시 목표, 실제로는 10시 안팎)이 뜬 뒤.
name: Prompt History Page

on:
  workflow_dispatch:
  schedule:
    - cron: '37 3 * * *'
  push:
    branches: [main]
    paths:
      - apps/backend/src/bot/hintPrompt.ts
      - scripts/prompt-history-notes.json

permissions:
  contents: write

concurrency:
  group: prompt-history
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — 페이지가 hintPrompt.ts의 과거 버전들을 git 이력에서 꺼내 세대를 가른다.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: 의존성 설치 (typescript — 세대 해시 계산에 필요)
        run: npm ci

      - name: 페이지 생성
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/prompt-history.mjs

      - name: 커밋·푸시
        run: |
          git config user.name "prompt-history-bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/frontend/guides/prompt-history.html
          if git diff --cached --quiet; then
            echo "바뀐 것 없음"
            exit 0
          fi
          git commit -m "docs: AI 출제자 개선 기록 페이지 갱신 (자동, prompt-history.yml)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
