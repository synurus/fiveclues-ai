# 자가개선 루프 — 플레이어 피드백(GitHub Issue, 'feedback' 라벨)을 모아
# apps/backend/src/bot/hintPrompt.ts 수정 PR을 연다. 병합은 사람이 한다.
# 자세한 설계는 scripts/self-improve/{gather,propose}.mjs 상단 주석 참고.
#
# 수동 실행: Actions 탭 → Self-Improve Prompt → Run workflow.
#   min_feedback 을 낮추면(예: 1) 피드백이 적어도 강제로 PR 시도까지 해볼 수 있다 —
#   배선 테스트용. 평소(새벽 자동 실행)엔 기본값 5를 그대로 쓴다.
name: Self-Improve Prompt

on:
  workflow_dispatch:
    inputs:
      min_feedback:
        description: '이 개수 미만이면 PR을 시도하지 않는다'
        required: false
        default: '5'
  schedule:
    # 매일 08:00 한국시간(KST, UTC+9) = 전날 23:00 UTC, 하루 한 번(2026-09-16 결정).
    # 원래는 자동플레이가 01~07시 KST에 몰려 있어서 그게 끝난 직후로 잡은 시각이다.
    # 2026-09-26부터 자동플레이는 24시간에 5번 흩어져 돌지만(self-improve-autoplay.yml),
    # 그 슬롯들(04:29, 09:17 KST 목표)과 한 시간 이상 떨어져 있어 그대로 뒀다.
    #
    # gather.mjs는 "최근 N시간"이 아니라 그 시점에 열려있는 피드백 이슈를 전부
    # 긁어오므로, 01시든 08시든 한 번 도는 실행이 보는 데이터는 동일하게 "그때까지
    # 쌓인 전체"다 — 그러니 굳이 여러 번 돌 필요 없이 하루 한 번으로 그 창 안에
    # 들어온 걸 전부 포함해서(=가장 많은 데이터로) 판단하면서 Groq 호출도 하루
    # 최대 1번으로 아낄 수 있다. propose.mjs의 "이미 열린 PR 있으면 스킵" 가드는
    # 전날 PR이 아직 안 머지됐을 때의 백업 안전장치로 남겨둔다.
    #
    # 정각(0분) 대신 7분: 매시 정각은 GitHub 전역 예약 워크플로가 몰리는 시간대라
    # 부하가 높으면 그 실행이 재시도 없이 그냥 스킵된다(공식 문서에 명시). 실제로
    # 2026-09-17 08:00 KST 예약 실행이 아예 안 돌아서 옮겼다.
    - cron: '7 23 * * *'

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — gather.mjs가 hintPrompt.ts가 main에 마지막으로 반영된 시각을
      # git log로 읽어서 그 전에 만든 AI 피드백을 걸러낸다(기본값 1이면 이력이 없다).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 이 레포는 npm 워크스페이스라 package-lock.json 이 루트에만 있다.
      # apps/backend 안에서 npm ci 를 돌리면 lockfile 을 못 찾아 바로 실패한다 —
      # 루트에서 설치해야 apps/backend 쪽 node_modules(tsc 검증에 필요)도 같이 준비된다.
      - name: 의존성 설치 (워크스페이스 전체)
        run: npm ci

      - name: 피드백 이슈 수집
        id: gather
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/self-improve/gather.mjs

      - name: 피드백이 너무 적으면 여기서 멈춤
        id: gate
        run: |
          MIN="${{ github.event.inputs.min_feedback || '5' }}"
          COUNT="${{ steps.gather.outputs.count }}"
          echo "피드백 $COUNT 건 / 기준 $MIN 건"
          if [ "$COUNT" -lt "$MIN" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      # SELFIMPROVE_BOT_* 시크릿이 없으면 게임 본체와 같은 BOT_* 를 그대로 쓴다
      # (propose.mjs 안에서 fallback 처리 — 여기선 둘 다 넘기기만 하면 된다).
      - name: 프롬프트 수정 PR 제안
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SELFIMPROVE_BOT_BASE_URL: ${{ secrets.SELFIMPROVE_BOT_BASE_URL }}
          SELFIMPROVE_BOT_API_KEY: ${{ secrets.SELFIMPROVE_BOT_API_KEY }}
          SELFIMPROVE_BOT_MODEL: ${{ secrets.SELFIMPROVE_BOT_MODEL }}
          BOT_BASE_URL: ${{ secrets.BOT_BASE_URL }}
          BOT_API_KEY: ${{ secrets.BOT_API_KEY }}
          BOT_MODEL: ${{ secrets.BOT_MODEL }}
        run: node scripts/self-improve/propose.mjs
